name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Tests (stampede, idempotency, reconciliation, prompt injection, ...)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_DB: wallet_test
          POSTGRES_USER: wallet
          POSTGRES_PASSWORD: wallet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wallet -d wallet_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5432/wallet_test
      TEST_DB_USER: wallet
      TEST_DB_PASSWORD: wallet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B verify
      - name: Test summary
        if: always()
        run: |
          echo "### Test results" >> "$GITHUB_STEP_SUMMARY"
          grep -h "Tests run" target/surefire-reports/*.txt | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: target/surefire-reports

  compose:
    name: docker compose up + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait
      - run: bash scripts/smoke.sh
      - run: docker compose --profile seed run --rm seed
      - name: Reconciliation over the 100k-transfer seed must pass
        run: |
          curl -fsS -X POST "http://localhost:8080/admin/reconciliation/run?wait=true" \
               -H "Idempotency-Key: $(cat /proc/sys/kernel/random/uuid)" | tee run.json
          python3 -c "import json; r = json.load(open('run.json')); print(r['status'], r['transfers_checked']); assert r['status'] == 'PASSED'"
      - run: docker compose ps && docker compose logs --tail 50 worker
        if: always()
      - run: docker compose down -v
        if: always()
